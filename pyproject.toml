[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathtrans"
version = "0.1.0"
description = "Layout-preserving translation of math learning materials (PDF) with in-image text replacement, editable output and automatic multi-dimensional QA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "anthropic>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "rapidocr-onnxruntime>=1.3",
    "python-docx>=1.1",
    "fonttools>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27"]

[project.scripts]
mathtrans = "mathtrans.cli:main"

[tool.setuptools.packages.find]
include = ["mathtrans*"]

[tool.setuptools.package-data]
mathtrans = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
